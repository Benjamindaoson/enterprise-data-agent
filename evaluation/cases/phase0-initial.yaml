suite_version: 0.1.0
cases:
  - case_id: GC-001
    title: July 2026 wholesale sales compared with June in a county
    business_question: What happened to wholesale sales in Polk County in July 2026 compared with June 2026?
    user_context: &analyst
      user_id: analyst@example.test
      tenant_id: iowa-demo
      roles: [business_analyst]
      policy_version: local-policy-v1
      allowed_metric_ids: [wholesale_sales_amount, bottles_ordered, volume_liters, average_wholesale_price_per_bottle, state_acquisition_cost, wholesale_gross_spread, wholesale_spread_rate, average_state_cost_per_bottle]
      allowed_dimension_ids: [order_date, month, year, store, county, city, vendor, category, product, pack, bottle_volume_ml]
      data_classification_ceiling: INTERNAL
    dataset_snapshot: &snapshot
      identifier: iowa_liquor_snapshot_2026_07_v1
      version: 2026-07
      content_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    semantic_package: &semantic
      identifier: iowa_liquor_wholesale
      version: 1.0.0
      content_hash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    expected_semantics:
      metric_ids: [wholesale_sales_amount]
      dimension_filters: {county: [Polk]}
      primary_period_start: 2026-07-01
      primary_period_end: 2026-07-31
      comparison_period_start: 2026-06-01
      comparison_period_end: 2026-06-30
    allowed_data_objects: [fact_liquor_order_line]
    required_evidence_count: 1
    required_claim_types: [FACT]
    tags: [semantic, month_over_month]
  - case_id: GC-002
    title: Wholesale spread contribution within cost window
    business_question: Which categories contributed most to the July 2026 versus June 2026 change in wholesale gross spread?
    user_context: *analyst
    dataset_snapshot: *snapshot
    semantic_package: *semantic
    expected_semantics:
      metric_ids: [wholesale_gross_spread]
      primary_period_start: 2026-07-01
      primary_period_end: 2026-07-31
      comparison_period_start: 2026-06-01
      comparison_period_end: 2026-06-30
      requested_grain: category
    allowed_data_objects: [fact_liquor_order_line]
    required_hypothesis_topics: [quantity, unit_price, product_mix]
    required_evidence_count: 2
    required_claim_types: [FACT, INFERENCE]
    tags: [contribution, cost_window]
