<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Enterprise Data Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand" onclick="navigate('home')" role="button" tabindex="0">
        <span class="brand-mark">◆</span>
        <div>
          <strong>Enterprise<br>Data Agent</strong>
          <small>AI-POWERED BI</small>
        </div>
      </div>

      <nav id="nav" aria-label="Main navigation">
        <div class="nav-label">Analyze</div>
        <div class="nav-group">
          <button data-page="home" class="active"><i>⌂</i><span>Home</span></button>
          <button data-page="new"><i>＋</i><span>New Analysis</span></button>
          <button data-page="dashboard"><i>▥</i><span>Dashboard</span></button>
        </div>

        <div class="nav-label">Explore</div>
        <div class="nav-group">
          <button data-page="evidence"><i>⌘</i><span>Evidence</span></button>
          <button data-page="history"><i>◷</i><span>History</span></button>
          <button data-page="data"><i>▦</i><span>Data Sources</span></button>
          <button data-page="semantic"><i>◇</i><span>Semantic Layer</span></button>
        </div>

        <div class="nav-label">Quality</div>
        <div class="nav-group">
          <button data-page="evaluation"><i>✓</i><span>Evaluation</span></button>
        </div>

        <div class="nav-label">System</div>
        <div class="nav-group">
          <button data-page="settings"><i>⚙</i><span>Settings</span></button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot"></span><span>System Online</span>
        <small>v2.0.0 · PostgreSQL + Redis</small>
      </div>

      <button class="collapse-button" onclick="toggleSidebar()" aria-label="Collapse sidebar">« <span>Collapse</span></button>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" onclick="toggleSidebar()" aria-label="Open navigation">☰</button>
        <div class="breadcrumb">
          <span class="eyebrow">Enterprise Data Agent</span>
          <h1 id="page-title">Home</h1>
        </div>

        <div class="top-actions">
          <div class="global-search">
            <span>⌕</span>
            <input id="global-search" placeholder="Search analyses, data…" />
            <kbd>⌘ K</kbd>
          </div>

          <button class="icon-button notification" aria-label="Notifications">♧<b>3</b></button>
          <button class="icon-button" aria-label="Help">?</button>
          <button class="button primary" onclick="navigate('new')">＋ New Analysis</button>
          <div class="user-menu">
            <span class="avatar">B</span>
            <span class="user-copy">
              <strong>Benjamin Daoson</strong>
              <small>Analyst</small>
            </span>
            <span>⌄</span>
          </div>
        </div>
      </header>

      <div class="mobile-task-context" id="mobile-task-context"></div>
      <section id="app" class="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="/static/app.js"></script>
</body>
</html>
