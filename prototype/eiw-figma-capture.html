function t(rows,heads){return `<table class="table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function page(){if(view==='01'||view==='02')return shell(`<h1 class="headline">今天要分析什么？</h1><div class="sub">发起、追踪并理解一次可信分析。首页不展示当前 Iowa 数据无法支持的业务能力。</div>${trust}<div class="grid" style="grid-template-columns:744px 1fr;margin-bottom:18px"><div class="card ask"><h2 style="font-size:22px;margin:0">你想分析什么业务问题？</h2><div class="muted">系统会先识别指标、时间和比较基线，再开始可验证调查。</div><div class="question">例如：2026 年 7 月批发销售额相比 6 月变化了多少？<div class="go">→</div></div><div class="chips">${['销售额变化','供应商贡献','品类价差','价量结构','County 趋势'].map(x=>`<span class="chip">${x}</span>`).join('')}</div></div><div class="card"><h3>推荐问题</h3><div class="muted">基于当前 Iowa 数据能力</div><div class="list">${['2026 年 7 月批发销售额相比 6 月变化了多少？','哪些供应商是销售额变化的主要贡献来源？','哪些品类造成了批发价差变化？','销售额变化由数量、价格还是结构变化解释？','Polk County 的批发销售趋势如何？','哪些结论目前无法由数据支持？'].map(x=>`<div>${x}</div>`).join('')}</div></div></div><div class="grid" style="grid-template-columns:744px 1fr"><div class="card"><h3>最近分析任务</h3>${t([['7 月批发销售分析','已完成','批发销售额','2026-07 vs 2026-06','已验证','2','查看'],['供应商 X 调查','运行中','批发销售额','2026-07 vs 2025-07','供应商下钻','1','查看'],['品类价差分析','部分完成','批发价差','2026-07 vs 2026-06','证据不足','1','继续'],['Polk County 趋势','失败','批发销售额','2026-01~07','查询失败','0','重试']],['任务','状态','指标','比较期间','当前步骤','证据','操作'])}</div><div class="card"><h3>工作台状态</h3><div class="muted mb18">只展示与分析能力直接相关的状态</div><div class="stats"><div class="stat"><label>最近完成</label><b>7 月批发销售分析</b><small>8 分钟前</small></div><div class="stat"><label>已保存证据</label><b>2 条</b><small>关联最近完成任务</small></div><div class="stat"><label>数据质量</label><b>READY</b><small>6,484,227 行</small></div><div class="stat"><label>指标可用期</label><b>批发价差</b><small>2025-07-01 起</small></div></div></div></div>`);
if(view==='03')return shell(`<h1 class="headline">发起一次新的分析</h1><div class="sub">在执行前先确认问题语义、时间范围、指标与比较基线。</div><div class="card mb18"><h3>业务问题</h3><div class="question">为什么 2026 年 7 月批发销售额下降，哪些供应商贡献最大？<button class="primary" style="position:absolute;right:16px;top:19px">解析问题</button></div></div><div class="grid" style="grid-template-columns:740px 1fr"><div class="card"><h3>AI 解析结果 <span class="badge ok">已解析</span></h3>${t([['指标','批发销售额','wholesale_sales v1.2'],['主期间','2026 年 7 月','2026-07-01 ~ 2026-07-31'],['比较基线','2025 年 7 月','同比'],['优先维度','供应商 / 品类 / 门店','语义包允许'],['数据集','Iowa 快照 v1','冻结至 2026-07-31']],['字段','识别结果','系统依据'])}<div class="stat warn" style="margin-top:18px"><label>澄清规则</label><b>若“利润”指会计净利润，当前数据不支持</b><small>系统会要求用户澄清，不会静默猜测</small></div></div><div class="card"><h3>分析计划预览</h3><div class="timeline">${['确认总体变化','价量结构分解','供应商贡献排序','下钻主要驱动','验证并生成结论'].map((x,i)=>`<div class="step"><span class="badge teal">${i+1}</span><strong>${x}</strong><span></span></div>`).join('')}</div><div class="rule"></div><div class="muted">预算上限</div><b>≤ 12 次工具调用 · ≤ 90 秒</b><div style="margin-top:22px"><button class="primary">开始分析</button></div></div></div>`);
