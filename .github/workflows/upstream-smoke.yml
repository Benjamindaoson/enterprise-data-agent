name: Upstream bootstrap smoke

on:
  push:
    branches:
      - feat/ba-agent-upstream-bootstrap
  pull_request:
    paths:
      - ".gitmodules"
      - "third_party/**"
      - "scripts/verify_upstreams.py"
      - "docs/UPSTREAM_BOOTSTRAP.md"
      - "THIRD_PARTY_NOTICES.md"

jobs:
  verify-upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned upstream layout
        run: python scripts/verify_upstreams.py
      - name: Compile DeepAnalyze bootstrap entrypoint
        run: python -m py_compile third_party/deepanalyze/deepanalyze.py
