name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint new business-agent modules
        run: >
          python -m ruff check
          src/eiw/business
          src/eiw/flywheel
          src/eiw/training
          src/eiw/runtime/governance.py
          src/eiw/runtime/memory.py
          src/eiw/runtime/skills.py
          tests/unit/test_business_operations.py
          tests/unit/test_flywheel_simulator.py
          tests/unit/test_training_pipeline.py
          scripts/generate_agent_trajectories.py
          scripts/run_agent_flywheel.py
          scripts/train_agent_sft.py
          scripts/train_agent_grpo.py
      - name: Tests
        run: python -m pytest -q

  post-training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install training stack
        run: python -m pip install -e '.[dev,training]'
      - name: Generate trajectories
        run: python scripts/generate_agent_trajectories.py --episodes-per-scenario 2
      - name: SFT smoke
        run: python scripts/train_agent_sft.py --epochs 30
      - name: GRPO smoke
        run: python scripts/train_agent_grpo.py --iterations 8 --group-size 6
      - name: Training unit tests
        run: python -m pytest tests/unit/test_flywheel_simulator.py tests/unit/test_training_pipeline.py -q
