name: Retail real-data benchmark

concurrency:
  group: retail-real-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_completejourney_cc0.py"
      - "scripts/run_retail_benchmark.py"
      - "scripts/run_retail_ablation.py"
      - "scripts/run_retail_adversarial_benchmark.py"
      - "evaluation/retail/frozen_holdout_v1.jsonl"
      - "scripts/benchmark_retail_scale.py"
      - "src/eiw/retail/**"
      - "src/eiw/web/static/ba-demo.html"
      - "src/eiw/web/static/ba-demo.js"
      - "src/eiw/web/static/ba-demo.css"
      - "pyproject.toml"
      - ".github/workflows/retail-real-data.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/fetch_completejourney_cc0.py"
      - "scripts/run_retail_benchmark.py"
      - "scripts/benchmark_retail_scale.py"
      - "src/eiw/retail/**"
      - "src/eiw/web/static/ba-demo.html"
      - "src/eiw/web/static/ba-demo.js"
      - "src/eiw/web/static/ba-demo.css"
      - "pyproject.toml"
      - ".github/workflows/retail-real-data.yml"

jobs:
  completejourney:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache materialized Complete Journey
        uses: actions/cache@v4
        with:
          path: data/retail
          key: completejourney-cc0-5b5d06192b9856edd04e4d405787af2f2e4a1fef-v1

      - name: Install retail data stack
        run: python -m pip install -e '.[dev,retail-data]'

      - name: Download and materialize public CC0 data
        run: python scripts/fetch_completejourney_cc0.py data/retail

      - name: Verify materialized dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("data/retail/completejourney-manifest.json").read_text())
          assert manifest["source_commit"] == "5b5d06192b9856edd04e4d405787af2f2e4a1fef"
          assert manifest["source_license"] == "CC0"
          assert manifest["files"]["transactions"]["rows"] == 1_469_307
          assert manifest["files"]["promotions"]["rows"] == 20_940_529
          print(json.dumps({
              "transactions": manifest["files"]["transactions"]["rows"],
              "promotions": manifest["files"]["promotions"]["rows"],
              "products": manifest["files"]["products"]["rows"],
          }, indent=2))
          PY

      - name: Run RetailAnalystBench on real data
        run: >
          python scripts/run_retail_benchmark.py
          --data-dir data/retail
          --output artifacts/retail-real-benchmark.json
          --assert-smoke

      - name: Run frozen adversarial holdout on real data
        run: >
          python scripts/run_retail_adversarial_benchmark.py
          --suite frozen
          --data-dir data/retail
          --output artifacts/retail-adversarial-frozen.json
          --assert-gate

      - name: Run rolling-window RetailAnalystBench
        run: >
          python scripts/run_retail_benchmark.py
          --data-dir data/retail
          --rolling
          --output artifacts/retail-rolling-benchmark.json

      - name: Run BA Agent harness ablation
        run: >
          python scripts/run_retail_ablation.py
          --data-dir data/retail
          --output artifacts/retail-harness-ablation.json

      - name: Run small real-data latency smoke
        run: >
          python scripts/benchmark_retail_scale.py
          data/retail
          --requests 3
          --concurrency 1
          > artifacts/retail-real-scale.json

      - name: Install demo browser
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium

      - name: Start BA Agent on real data
        run: |
          mkdir -p artifacts/ba-demo
          EIW_RETAIL_DATA_DIR="$PWD/data/retail" \
            python -m uvicorn eiw.app:app --host 127.0.0.1 --port 8000 \
            > artifacts/ba-demo/ba-api.log 2>&1 &
          echo $! > artifacts/ba-demo/ba-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/ba/retail/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/ba-demo/ba-api.log
          exit 1

      - name: Capture real-data product proof
        run: >
          python scripts/capture_ba_demo.py
          --base-url http://127.0.0.1:8000
          --output-dir artifacts/ba-demo

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: retail-real-data-benchmark
          path: |
            data/retail/completejourney-manifest.json
            artifacts/retail-real-benchmark.json
            artifacts/retail-real-scale.json
            artifacts/retail-harness-ablation.json
            artifacts/retail-rolling-benchmark.json
            artifacts/retail-adversarial-frozen.json
            artifacts/ba-demo/ba-agent-before-run.png
            artifacts/ba-demo/ba-agent-real-data.png
            artifacts/ba-demo/ba-agent-real-data.webm
            artifacts/ba-demo/ba-agent-executive-report.html
            artifacts/ba-demo/ba-agent-executive-report.pdf
            artifacts/ba-demo/ba-agent-trace.zip
            artifacts/ba-demo/demo-proof.txt
            artifacts/ba-demo/ba-api.log
          if-no-files-found: error
          retention-days: 30
