name: Retail model architecture benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider
        required: true
        type: choice
        options:
          - openai
          - qwen
          - anthropic
          - gemini
      cases:
        description: RetailAnalystBench cases per architecture (1-10)
        required: true
        default: "10"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_INPUT_USD_PER_MTOK: ${{ vars.OPENAI_INPUT_USD_PER_MTOK }}
      OPENAI_OUTPUT_USD_PER_MTOK: ${{ vars.OPENAI_OUTPUT_USD_PER_MTOK }}

      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL }}
      QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
      QWEN_INPUT_USD_PER_MTOK: ${{ vars.QWEN_INPUT_USD_PER_MTOK }}
      QWEN_OUTPUT_USD_PER_MTOK: ${{ vars.QWEN_OUTPUT_USD_PER_MTOK }}

      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      ANTHROPIC_INPUT_USD_PER_MTOK: ${{ vars.ANTHROPIC_INPUT_USD_PER_MTOK }}
      ANTHROPIC_OUTPUT_USD_PER_MTOK: ${{ vars.ANTHROPIC_OUTPUT_USD_PER_MTOK }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
      GEMINI_INPUT_USD_PER_MTOK: ${{ vars.GEMINI_INPUT_USD_PER_MTOK }}
      GEMINI_OUTPUT_USD_PER_MTOK: ${{ vars.GEMINI_OUTPUT_USD_PER_MTOK }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark stack
        run: python -m pip install -e '.[dev,retail-data]'
      - name: Materialize pinned Complete Journey
        run: python scripts/fetch_completejourney_cc0.py data/retail
      - name: Run architecture benchmark
        run: >
          python scripts/run_retail_model_benchmark.py
          --provider ${{ inputs.provider }}
          --cases ${{ inputs.cases }}
          --data-dir data/retail
          --output artifacts/model-benchmark-${{ inputs.provider }}.json
      - name: Upload measured result
        uses: actions/upload-artifact@v4
        with:
          name: retail-model-benchmark-${{ inputs.provider }}
          path: artifacts/model-benchmark-${{ inputs.provider }}.json
          if-no-files-found: error
          retention-days: 30
