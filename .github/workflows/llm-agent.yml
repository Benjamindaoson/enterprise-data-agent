name: llm-agent

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Open-weight model id"
        required: true
        default: "Qwen/Qwen3-0.6B"
      cases:
        description: "BusinessAgentBench cases"
        required: true
        default: "32"
      run_grpo:
        description: "Run GRPO after SFT"
        type: boolean
        required: true
        default: false

jobs:
  qwen-agent:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LLM stack
        run: python -m pip install -e '.[dev,llm]'
      - name: Export held-out trajectory dataset
        run: python scripts/export_llm_agent_dataset.py --cases ${{ inputs.cases }}
      - name: Evaluate prompted base model
        run: >
          python scripts/evaluate_llm_agent.py
          --model "${{ inputs.model }}"
          --cases 8
      - name: LoRA SFT
        run: >
          python scripts/train_llm_agent_sft.py
          --model "${{ inputs.model }}"
          --epochs 1
      - name: Evaluate SFT
        run: >
          python scripts/evaluate_llm_agent.py
          --model "${{ inputs.model }}"
          --adapter artifacts/models/qwen3-agent-sft
          --cases 8
      - name: GRPO
        if: ${{ inputs.run_grpo }}
        run: >
          python scripts/train_llm_agent_grpo.py
          --model "${{ inputs.model }}"
          --iterations 1
          --group-size 2
      - name: Evaluate SFT + GRPO
        if: ${{ inputs.run_grpo }}
        run: >
          python scripts/evaluate_llm_agent.py
          --model "${{ inputs.model }}"
          --adapter artifacts/models/qwen3-agent-grpo
          --cases 8
