services:
  mysql:
    image: mysql:8.4
    container_name: crossborder-ops-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: crossborder_ops
    ports:
      - "3306:3306"
    volumes:
      - crossborder_mysql:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: crossborder-ops-redis
    ports:
      - "6379:6379"

volumes:
  crossborder_mysql:
