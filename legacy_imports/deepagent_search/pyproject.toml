[project]
name = "deepagent-search"
version = "0.1.0"
description = "A DeepAgents-based deep search and report generation backend."
requires-python = ">=3.12"

dependencies = [
    # =========================
    # Web 后端
    # =========================
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "python-multipart>=0.0.29",
    "aiofiles>=25.1.0",
    # =========================
    # Agent / LLM
    # =========================
    "deepagents>=0.6.6",
    "langchain-openai>=1.2.2",
    # =========================
    # 环境变量
    # =========================
    "python-dotenv>=1.2.2",
    # =========================
    # 联网搜索
    # =========================
    "tavily-python>=0.7.24",
    # =========================
    # RAGFlow
    # =========================
    "ragflow-sdk==0.24.0",
    # =========================
    # MySQL 数据库
    # =========================
    "mysql-connector-python>=9.7.0",
    # =========================
    # 文件读取
    # =========================
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    # =========================
    # Markdown / PDF
    # =========================
    "markdown>=3.10.2",
    "pywin32>=311; sys_platform == 'win32'",
    # =========================
    # 配置文件
    # =========================
    "pyyaml>=6.0.3",
    # =========================
    # 网络请求
    # =========================
    "requests>=2.34.2",
    # =========================
    # 日志
    # =========================
    "colorlog>=6.10.1",
]


[tool.uv]
package = false
