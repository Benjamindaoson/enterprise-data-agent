app = "crossborder-ops-agent-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_AUTH_ENABLED = "true"
  CORS_ORIGINS = "https://example-frontend.app"
  RATE_LIMIT_PER_MINUTE = "120"
  LLM_BASE_URL = "https://api.deepseek.com/v1"
  LLM_MODEL = "deepseek-chat"
  OTEL_ENABLED = "false"

[http_service]
  internal_port = 8087
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
