name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest
      - run: python -m compileall app tests
      - run: DB_URL=sqlite:///./ci-migration.db python -m alembic upgrade head
      - run: python -m app.eval_runner
      - run: npx openspec validate production-hardening
