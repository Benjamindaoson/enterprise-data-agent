services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: crossborder_ops
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: mysql+pymysql://root:@mysql:3306/crossborder_ops?charset=utf8mb4
      APP_ENV: production
      APP_AUTH_ENABLED: "true"
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:?set APP_AUTH_SECRET}
      APP_LOGIN_CODE: ${APP_LOGIN_CODE:?set APP_LOGIN_CODE}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-local}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      REDIS_URL: redis://redis:6379/0
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8087:8087"
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m app.seed &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8087 --workers 2"

volumes:
  mysql-data:
