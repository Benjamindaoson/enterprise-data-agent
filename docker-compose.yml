services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eiw
      POSTGRES_USER: eiw
      POSTGRES_PASSWORD: eiw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eiw -d eiw"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
